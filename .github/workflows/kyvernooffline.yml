name: Kyverno Offline Images (individual TAR files)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-image:
    name: Export ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: kyvernopre
            image: ghcr.io/kyverno/kyvernopre:v1.11.1
          - component: kyverno
            image: ghcr.io/kyverno/kyverno:v1.11.1
          - component: background-controller
            image: ghcr.io/kyverno/background-controller:v1.11.1
          - component: cleanup-controller
            image: ghcr.io/kyverno/cleanup-controller:v1.11.1
          - component: reports-controller
            image: ghcr.io/kyverno/reports-controller:v1.11.1

    steps:
      - name: Pull image for linux/amd64
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"

      - name: Save this image to its own TAR
        env:
          IMAGE: ${{ matrix.image }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          TAR_NAME="kyverno-${COMPONENT}-v1.11.1-amd64.tar"
          docker save --output "$TAR_NAME" "$IMAGE"
          test -s "$TAR_NAME"
          tar -tf "$TAR_NAME" | grep -q '^manifest.json$'
          echo "Archive created: $TAR_NAME"
          ls -lh "$TAR_NAME"

      - name: Upload one TAR per component
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-${{ matrix.component }}-v1.11.1-amd64
          path: kyverno-${{ matrix.component }}-v1.11.1-amd64.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
