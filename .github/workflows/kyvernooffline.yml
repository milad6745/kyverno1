
name: Build Kyverno Offline Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KYVERNO_VERSION: v1.11.4
  OFFLINE_REGISTRY: repo.nexus.local:32082
  OFFLINE_PREFIX: kyverno

jobs:
  build-offline-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML --break-system-packages

      - name: Download official manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle

          curl -fL --retry 3 \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/install.yaml" \
            -o bundle/install.yaml

          test -s bundle/install.yaml

      - name: Extract images and rewrite manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import yaml
          import hashlib
          from pathlib import Path

          bundle = Path("bundle")
          registry = os.environ["OFFLINE_REGISTRY"].rstrip("/")
          prefix = os.environ["OFFLINE_PREFIX"].strip("/")

          with (bundle / "install.yaml").open() as f:
              docs = list(yaml.safe_load_all(f))

          # Collect image references specifically from
          # container definitions, including init containers.
          images = set()

          container_fields = {
              "containers",
              "initContainers",
              "ephemeralContainers",
          }

          def collect(obj):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key in container_fields and isinstance(value, list):
                          for container in value:
                              if not isinstance(container, dict):
                                  continue

                              image = container.get("image")
                              if isinstance(image, str) and image:
                                  images.add(image)

                      collect(value)

              elif isinstance(obj, list):
                  for item in obj:
                      collect(item)

          for document in docs:
              collect(document)

          if not images:
              raise RuntimeError(
                  "No container images found in manifest"
              )

          mapping = {}

          for source in sorted(images):
              digest = hashlib.sha256(
                  source.encode("utf-8")
              ).hexdigest()[:16]

              target = (
                  f"{registry}/{prefix}/"
                  f"image-{digest}:offline"
              )

              mapping[source] = target

          # Rewrite only real container image references.
          def replace(obj):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key in container_fields and isinstance(value, list):
                          for container in value:
                              if not isinstance(container, dict):
                                  continue

                              source = container.get("image")

                              if (
                                  isinstance(source, str)
                                  and source in mapping
                              ):
                                  container["image"] = mapping[source]

                      replace(value)

              elif isinstance(obj, list):
                  for item in obj:
                      replace(item)

          for document in docs:
              replace(document)

          with (bundle / "install-offline.yaml").open("w") as f:
              yaml.safe_dump_all(
                  docs,
                  f,
                  sort_keys=False,
                  explicit_start=True
              )

          with (bundle / "images.txt").open("w") as f:
              for image in sorted(mapping):
                  f.write(image + "\n")

          with (bundle / "image-map.tsv").open("w") as f:
              for source, target in sorted(mapping.items()):
                  f.write(f"{source}\t{target}\n")

          print(f"Total unique images: {len(mapping)}")

          for source, target in sorted(mapping.items()):
              print(f"{source} -> {target}")
          PY

      - name: Pull all unique images
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r image; do
            echo "Pulling $image"
            docker pull --platform linux/amd64 "$image"
          done < bundle/images.txt

      - name: Save images to one TAR
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t IMAGES < bundle/images.txt

          docker save \
            -o bundle/images.tar \
            "${IMAGES[@]}"

          test -s bundle/images.tar

      - name: Generate load and push script
        shell: bash
        run: |
          set -euo pipefail

          cat > bundle/load-and-push.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          cd "$(dirname "$0")"

          docker load -i images.tar

          while IFS=$'\t' read -r source target; do
            echo "Tagging: $source -> $target"
            docker tag "$source" "$target"

            echo "Pushing: $target"
            docker push "$target"
          done < image-map.tsv

          echo "All images pushed successfully"
          EOF

          chmod +x bundle/load-and-push.sh

      - name: Validate offline bundle
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import yaml

          with open("bundle/install-offline.yaml") as f:
              docs = list(yaml.safe_load_all(f))

          assert docs, "Manifest is empty"

          with open("bundle/images.txt") as f:
              images = [
                  x.strip() for x in f if x.strip()
              ]

          assert images, "No images"
          assert len(images) == len(set(images)), \
              "Duplicate images detected"

          print("YAML validation passed")
          print("Unique images:", len(images))
          PY

          bash -n bundle/load-and-push.sh

      - name: Create ZIP bundle
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="kyverno-offline-${KYVERNO_VERSION}.zip"

          cd bundle

          zip -q -0 "../${ZIP_NAME}" \
            install.yaml \
            install-offline.yaml \
            images.tar \
            images.txt \
            image-map.tsv \
            load-and-push.sh

          cd ..

          ls -lh "${ZIP_NAME}"

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-offline-bundle
          path: kyverno-offline-${{ env.KYVERNO_VERSION }}.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
